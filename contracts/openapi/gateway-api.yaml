openapi: '3.1.0'
info:
  title: Gateway API — Client Contract
  version: '1.0.0'
  description: |
    The Gateway API is how clients interact with the Personal AI system.
    Web apps, CLIs, mobile apps, bots, voice assistants, other AI agents — any client
    that can send messages and receive streamed responses is valid.

    The Gateway manages conversations and routes interactions to the Agent Loop. It is
    content-agnostic (text, images, audio, video, files — all just data) and
    interface-agnostic (serves all clients identically).

    Auth is cross-cutting — not the Gateway's concern. Requests must be authenticated
    before reaching the Gateway, but how (middleware, proxy, sidecar) is an
    implementation decision.

    Conversations live in the system, not in any client. Start on web, continue on
    mobile, pick up on CLI. The conversation persists regardless of which client connects.

    Source: gateway-spec.md (D57, D58, D59, D61)

servers:
  - url: '{protocol}://{host}:{port}'
    description: Gateway server (deployment-specific)
    variables:
      protocol:
        default: https
        enum:
          - http
          - https
      host:
        default: localhost
      port:
        default: '3000'

security:
  - bearerAuth: []
  - apiKeyAuth: []

paths:
  /conversations/messages:
    post:
      operationId: sendMessage
      summary: Send a message — creates a new conversation
      description: |
        Send a message without a conversation ID to start a new conversation.
        The Gateway creates the conversation, routes the message to the Agent Loop,
        and streams the response back.

        The Gateway assembles the messages array for the Agent Loop:
        1. System message from configuration
        2. The current message from this request
        3. Metadata passed through

        Returns an SSE stream of the Agent Loop's response, plus the new conversation ID
        in the response headers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            examples:
              newConversation:
                summary: Start a new conversation
                value:
                  content:
                    - type: text
                      text: 'Help me plan my finances'
                  metadata:
                    path: '/finances'
      responses:
        '200':
          description: |
            SSE stream of the Agent Loop's response. The new conversation ID is returned
            in the X-Conversation-ID response header.
          headers:
            X-Conversation-ID:
              description: The ID of the newly created conversation
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ClientSSEStream'
        '400':
          description: Invalid request — missing content, bad format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The current message and required overhead exceed the selected model's context limit (`context_overflow`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: context_overflow
                message: The message cannot fit the selected model's context window.
        '503':
          description: Agent Loop unavailable, or no safe limit is known for the selected provider and model (`context_limit_unknown`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: context_limit_unknown
                message: The selected model's context limit is unavailable.

  /conversations:
    get:
      operationId: listConversations
      summary: List conversations
      description: |
        List conversations with optional filtering. Returns conversation summaries,
        not full message history. Conversations are stored in Your Memory, managed
        by the Gateway.
      parameters:
        - name: limit
          in: query
          description: Maximum number of conversations to return
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Number of conversations to skip (for pagination)
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: search
          in: query
          description: Search conversations by content or title
          schema:
            type: string
        - name: from
          in: query
          description: Filter conversations created after this timestamp (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Filter conversations created before this timestamp (ISO 8601)
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of conversation summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationList'
        '401':
          description: Authentication required or failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /conversations/{id}:
    get:
      operationId: getConversation
      summary: Get conversation history
      description: |
        Retrieve the full message history for a conversation. Any client can request
        any conversation — conversations live in the system, not in clients.
      parameters:
        - name: id
          in: path
          required: true
          description: The conversation ID
          schema:
            type: string
      responses:
        '200':
          description: Conversation with full message history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '401':
          description: Authentication required or failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /conversations/{id}/messages:
    post:
      operationId: sendMessageToConversation
      summary: Send a message to an existing conversation
      description: |
        Resume an existing conversation by sending a new message. The Gateway retrieves
        the conversation history from Your Memory, assembles the full messages array
        (system prompt + history + current message), and routes to the Agent Loop.

        This is what enables seamless client switching — start on web, continue on
        mobile, pick up on CLI. The conversation persists.
      parameters:
        - name: id
          in: path
          required: true
          description: The conversation ID to resume
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            examples:
              resumeConversation:
                summary: Continue a budgeting conversation
                value:
                  content:
                    - type: text
                      text: 'Focus on budgeting'
                  metadata:
                    path: '/finances'
      responses:
        '200':
          description: |
            SSE stream of the Agent Loop's response. The conversation ID is confirmed
            in the X-Conversation-ID response header.
          headers:
            X-Conversation-ID:
              description: The conversation ID (confirms the conversation being resumed)
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ClientSSEStream'
        '400':
          description: Invalid request — missing content, bad format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The current message and required overhead exceed the selected model's context limit (`context_overflow`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: context_overflow
                message: The message cannot fit the selected model's context window.
        '503':
          description: Agent Loop unavailable, or no safe limit is known for the selected provider and model (`context_limit_unknown`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: context_limit_unknown
                message: The selected model's context limit is unavailable.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Bearer token authentication. Token obtained through the auth system.
        Auth is cross-cutting (D60) — independent of the Gateway.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key authentication for programmatic access. API keys are generated
        by the owner. V1 API keys are full-access (owner-level).

  schemas:
    SendMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: array
          minItems: 1
          items:
            $ref: '../schemas/message.json#/$defs/ContentPart'
          description: |
            Ordered message content parts. The Gateway is content-agnostic and passes
            them through without interpretation.
        metadata:
          type: object
          additionalProperties: true
          description: |
            Client-provided metadata. The Gateway passes this through — it does not
            add, modify, or interpret content. Making the Gateway context-aware would
            make it product-specific.

            Common metadata fields include path (current scope), folder, or any other
            context the client wants the model to see.
          examples:
            - path: '/finances'
              folder: 'life/finances'

    ConversationList:
      type: object
      required:
        - conversations
        - total
      properties:
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/ConversationSummary'
        total:
          type: integer
          description: Total number of conversations matching the query
        limit:
          type: integer
          description: The limit that was applied
        offset:
          type: integer
          description: The offset that was applied

    ConversationSummary:
      type: object
      required:
        - id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique conversation identifier
        title:
          type: [string, 'null']
          description: Conversation title (derived from first message or set by user)
        created_at:
          type: string
          format: date-time
          description: When the conversation was created
        updated_at:
          type: string
          format: date-time
          description: When the last message was added
        message_count:
          type: integer
          description: Number of messages in the conversation

    Conversation:
      type: object
      required:
        - id
        - messages
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique conversation identifier
        title:
          type: [string, 'null']
          description: Conversation title
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMessage'
          description: Full message history for this conversation
        created_at:
          type: string
          format: date-time
          description: When the conversation was created
        updated_at:
          type: string
          format: date-time
          description: When the last message was added

    ConversationMessage:
      allOf:
        - $ref: '../schemas/message.json'
        - type: object
          required:
            - id
            - created_at
          if:
            properties:
              role:
                const: assistant
            required:
              - role
          then:
            required:
              - model
              - provider
          properties:
            id:
              type: string
              description: Unique message identifier within the conversation
            created_at:
              type: string
              format: date-time
              description: When this message was created
            metadata:
              type: object
              additionalProperties: true
              description: Client-provided metadata that was sent with this message
            model:
              type: string
              description: For assistant messages, the model that produced this reply (D194)
            provider:
              type: string
              description: For assistant messages, the provider profile that produced this reply (D194)

    # --- Client SSE Stream ---

    ClientSSEStream:
      description: |
        Server-Sent Events stream delivered to the client. The Gateway forwards
        the Agent Loop's stream to the calling client, adding conversation context.

        Events mirror the Agent Loop's SSE events (see gateway-engine.yaml), with
        an optional Gateway-owned context_notice before model output when older
        history was omitted or summarized.
      oneOf:
        - $ref: '#/components/schemas/TextDeltaEvent'
        - $ref: '#/components/schemas/ToolCallEvent'
        - $ref: '#/components/schemas/ToolResultEvent'
        - $ref: '#/components/schemas/ApprovalRequestEvent'
        - $ref: '#/components/schemas/ApprovalResultEvent'
        - $ref: '#/components/schemas/ContextNoticeEvent'
        - $ref: '#/components/schemas/DoneEvent'
        - $ref: '#/components/schemas/ErrorEvent'
      discriminator:
        propertyName: _event_type

    TextDeltaEvent:
      type: object
      description: Model generates text — streamed incrementally
      required:
        - _event_type
        - content
      properties:
        _event_type:
          type: string
          const: text-delta
        content:
          type: string
          description: A chunk of generated text

    ToolCallEvent:
      type: object
      description: |
        Model initiates a tool call. Clients use these for status display
        ("Reading file...", "Searching library...") and approval gates.
      required:
        - _event_type
        - id
        - name
      properties:
        _event_type:
          type: string
          const: tool-call
        id:
          type: string
          description: Tool call identifier
        name:
          type: string
          description: Name of the tool being called
        arguments:
          type: object
          additionalProperties: true
          description: Arguments passed to the tool

    ToolResultEvent:
      type: object
      description: Tool execution completes
      required:
        - _event_type
        - id
      properties:
        _event_type:
          type: string
          const: tool-result
        id:
          type: string
          description: Matches the corresponding tool-call id
        error_code:
          type: string
          enum:
            - not_permitted
            - tool_error
            - auth_unavailable
          description: Machine-readable failure reason when the tool did not run
        output:
          type: string
          description: Successful tool output
        error:
          type: string
          description: Tool execution error

    ApprovalRequestEvent:
      type: object
      description: Optional product approval request emitted before a covered tool executes.
      required: [_event_type, request_id, tool_name, summary, status, created_at, expires_at]
      properties:
        _event_type: { type: string, const: approval-request }
        request_id: { type: string }
        tool_call_id: { type: string }
        actor_id: { type: string }
        tool_name: { type: string }
        summary: { type: string }
        status: { type: string, const: pending }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        correlation_id: { type: string }

    ApprovalResultEvent:
      type: object
      description: Optional product approval outcome; terminal and idempotent by request_id.
      required: [_event_type, request_id, decision, decided_at]
      properties:
        _event_type: { type: string, const: approval-result }
        request_id: { type: string }
        actor_id: { type: string }
        decided_by: { type: string }
        decision: { type: string, enum: [approved, denied, cancelled, expired] }
        reason: { type: string }
        decided_at: { type: string, format: date-time }
        correlation_id: { type: string }

    ContextNoticeEvent:
      type: object
      description: |
        Gateway notice sent before model output whenever older complete turns
        were omitted from the working context. This event is absent when no
        history was left out. Clients can show it to the owner;
        the full conversation remains available through the history API.
      required: [_event_type, action, omitted_turn_count, message]
      properties:
        _event_type:
          type: string
          const: context_notice
        action:
          type: string
          enum: [omitted, summarized]
        omitted_turn_count:
          type: integer
          minimum: 1
        message:
          type: string
          minLength: 1
          description: Safe owner-readable notice, with no omitted content

    DoneEvent:
      type: object
      description: |
        Response complete. The Gateway has stored the message and response in the
        conversation. The message_id confirms the stored record.
      required:
        - _event_type
        - finish_reason
      properties:
        _event_type:
          type: string
          const: done
        finish_reason:
          type: string
          description: Why the response ended
        message_id:
          type: string
          description: ID of the stored assistant message in the conversation
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer

    ErrorEvent:
      type: object
      description: |
        Failure during processing. The Gateway translates Agent Loop errors into
        client-appropriate messages while preserving the canonical
        `model_unavailable` and `capability_unsupported` codes (D197).
      required:
        - _event_type
        - code
        - message
      properties:
        _event_type:
          type: string
          const: error
        code:
          type: string
          description: Error category. Model selection and ability failures retain their canonical codes; other errors may use additional codes.
        message:
          type: string
          description: Human-readable error description
        capability:
          type: string
          minLength: 1
          description: Machine-readable missing ability; required when code is `capability_unsupported`.
      if:
        properties:
          code:
            const: capability_unsupported
      then:
        required: [capability]

    Error:
      type: object
      description: Pre-stream or non-streaming error response
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code, preserving `model_unavailable` and `capability_unsupported` for those conditions (D197).
        message:
          type: string
          description: Human-readable error description
        capability:
          type: string
          minLength: 1
          description: Required when code is `capability_unsupported`.
      if:
        properties:
          code:
            const: capability_unsupported
      then:
        required: [capability]
